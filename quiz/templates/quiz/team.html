{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Quiz · Team {{ team_name }}</title>
  <link rel="stylesheet" href="{% static 'quiz/app.css' %}">
  <link rel="stylesheet" href="{% static 'quiz/freeze.css' %}">
  <link rel="stylesheet" href="{% static 'quiz/incorrect-answer.css' %}">
  <script defer src="{% static 'quiz/vendor/htmx.min.js' %}"></script>
</head>
<body class="game-page game-page--team">
  <main class="app-shell">
    <header class="page-header"><div><p class="eyebrow">Christmas Escape Room</p><h1>Team {{ team_name }}</h1></div>
      <form method="post" action="{% url 'logout' %}" style="position: relative; z-index: 40;">{% csrf_token %}<button type="submit">Log out</button></form>
    </header>
    <section id="live-game" aria-label="Current game">
      <p id="connection-status" role="status"></p>
      <p id="action-feedback" class="feedback" role="status"></p>
      <div id="poller" hx-get="{% url 'team_state' %}"
           hx-trigger="every 500ms [!document.hidden], visibilitychange[!document.hidden] from:document"
           hx-sync="#live-game:drop" hx-include="#view-context, #actions-context"
           hx-target="#game-status" hx-swap="innerHTML"></div>
      <div id="game-status" aria-live="polite">
        {% include 'quiz/_team_state.html' with replace_pane=False replace_actions=False %}
      </div>
      {% include 'quiz/_team_actions.html' %}
      {% include 'quiz/_question_pane.html' %}
    </section>
  </main>
  <div id="door-completion" class="door-completion door-completion--idle" aria-hidden="true"></div>
  <div id="incorrect-answer-effect" class="incorrect-answer-effect incorrect-answer-effect--idle" aria-hidden="true"></div>
  <script>
    document.body.addEventListener('htmx:responseError', function (event) {
      const status = event.detail.xhr.status;
      const isAction = event.detail.elt.closest('form') !== null;
      if (isAction && status >= 400 && status < 500) {
        const message = 'Action rejected: ' + event.detail.xhr.responseText;
        document.getElementById('action-feedback').textContent = message;
        const shopFeedback = document.getElementById('shop-feedback');
        if (shopFeedback) shopFeedback.textContent = message;
      } else {
        document.getElementById('connection-status').textContent =
          'Connection trouble. Retrying…';
      }
    });
    document.body.addEventListener('htmx:sendError', function () {
      document.getElementById('connection-status').textContent = 'Connection trouble. Retrying…';
    });
    document.body.addEventListener('htmx:afterRequest', function (event) {
      if (event.detail.successful) document.getElementById('connection-status').textContent = '';
    });
    let reopenShop = false;
    document.body.addEventListener('htmx:oobBeforeSwap', function (event) {
      if (event.detail.target.id === 'team-actions') {
        const shop = document.getElementById('team-shop-dialog');
        reopenShop = Boolean(shop && shop.open);
      }
    });
    document.body.addEventListener('htmx:oobAfterSwap', function (event) {
      if (event.detail.target.id === 'team-actions' && reopenShop) {
        const shop = document.getElementById('team-shop-dialog');
        if (shop) shop.showModal();
        reopenShop = false;
      }
    });
  </script>
</body>
</html>
