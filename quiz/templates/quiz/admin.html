{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Quiz · Admin</title>
  <link rel="stylesheet" href="{% static 'quiz/app.css' %}">
  <script defer src="{% static 'quiz/vendor/htmx.min.js' %}"></script>
</head>
<body>
  <main class="app-shell app-shell-wide">
    <header class="page-header"><h1>Game master</h1>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    </header>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <section id="live-admin" aria-label="Live game administration">
      <div id="admin-poller" hx-get="{% url 'admin_state' %}" hx-trigger="every 500ms [!document.hidden], visibilitychange[!document.hidden] from:document"
           hx-sync="#live-admin:drop" hx-target="#admin-state" hx-swap="innerHTML"></div>
      <div id="admin-state">{% include 'quiz/_admin_state.html' %}</div>
    </section>
  </main>
</body>
</html>
