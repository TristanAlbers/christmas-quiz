{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Quiz</title>
  <link rel="stylesheet" href="{% static 'quiz/app.css' %}">
  <script defer src="{% static 'quiz/vendor/htmx.min.js' %}"></script>
</head>
<body>
  <main>
    <h1>Christmas Quiz</h1>
    <p>Development first slice</p>
    {% if user.is_authenticated %}
      <p><a href="{% url 'team' %}">Team view</a> · <a href="{% url 'admin_game' %}">Admin view</a></p>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>
    {% else %}
      <p><a href="{% url 'login' %}">Log in</a></p>
    {% endif %}
  </main>
</body>
</html>
