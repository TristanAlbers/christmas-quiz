<div id="team-resource-values"
     data-balance="{{ state.points }}"
     data-hint-tokens="{{ state.hint_tokens }}"
     {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
  <div class="resource-card resource-card--coins" aria-label="{{ state.points }} punten">
    <span class="resource-points-mark" aria-hidden="true">✦</span>
    <strong class="resource-points-value">{{ state.points }}</strong>
    <span class="resource-points-label">punten</span>
  </div>
  <div class="resource-card resource-card--fragments" aria-label="Fragmenten (decoratieve kaarten)">
    <strong>Fragmenten</strong>
    <div class="fragment-track" aria-hidden="true">
      <span class="fragment-chip">✧</span>
      <span class="fragment-chip">✦</span>
    </div>
  </div>
  <div class="resource-card resource-card--reverse{% if state.uno_reverse_active %} resource-card--active{% endif %}">
    <span class="resource-reverse-card" aria-hidden="true">
      <span class="resource-reverse-card__brand">UNO</span>
      <span class="resource-reverse-card__symbol"><svg viewBox="0 0 70 84" fill="none" aria-hidden="true"><path d="M20 28 C20 13 47 9 49 26 L54 26 44 40 34 26 39 26 C37 20 27 23 27 30"/><path d="M50 56 C49 71 22 74 20 57 L15 57 25 44 35 57 30 57 C32 64 43 61 43 54"/></svg></span>
      <span class="resource-reverse-card__name">REVERSE</span>
    </span>
    <span class="resource-reverse-copy">
      <strong>Uno Reverse</strong>
      <b>{% if state.uno_reverse_active %}Actief{% else %}Niet actief{% endif %}</b>
      <small>{% if state.uno_reverse_active %}Kaatst Freeze terug{% else %}Te koop in de winkel{% endif %}</small>
    </span>
  </div>
</div>
