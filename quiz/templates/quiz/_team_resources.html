<div id="team-resource-values"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <div class="resource-card resource-card--coins"><span aria-hidden="true">✦</span><strong>{{ state.points }}</strong><span>points</span></div>
  <div class="resource-card resource-card--hint"><span class="hint-token" aria-hidden="true">?</span><strong>{{ state.hint_tokens }} Hint tokens</strong><span>available</span></div>
  <div class="resource-card resource-card--reverse{% if state.uno_reverse_active %} resource-card--active{% endif %}"><span class="reverse-mark" aria-hidden="true">↶</span><strong>Uno Reverse {% if state.uno_reverse_active %}active{% else %}inactive{% endif %}</strong><span>{% if state.uno_reverse_active %}Ready to reflect{% else %}Not held{% endif %}</span></div>
</div>
