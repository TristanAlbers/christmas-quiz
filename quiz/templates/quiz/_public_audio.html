{% load static %}
<div id="overview-audio-state"{% if oob %} hx-swap-oob="outerHTML"{% endif %}
     class="overview-audio-state"
     data-audio-context="{{ audio_context }}"
     data-run-id="{{ state.run_id|default:'' }}"
     data-global-state="{{ state.global_state }}"
     data-music-phase="{% if state.music %}{{ state.music.phase }}{% endif %}"
     data-question-number="{% if state.music and state.music.question_number %}{{ state.music.question_number }}{% endif %}"
     data-audio-url="{% if state.music and state.music.audio_url %}{{ state.music.audio_url }}{% endif %}"
     aria-hidden="true">
  <input class="poll-context" type="hidden" name="audio_context" value="{{ audio_context }}">
</div>
{% if not oob %}
<section id="overview-audio-player"
         class="music-audio-panel"
         data-sound-state="not-enabled"
         data-sound-check-url="{% static 'quiz/sound-check.wav' %}"
         aria-labelledby="music-audio-heading">
  <div class="music-audio-panel__ornament" aria-hidden="true">♫</div>
  <div class="music-audio-panel__copy" role="status" aria-live="polite" aria-atomic="true">
    <p class="eyebrow">TV sound</p>
    <div class="music-audio-panel__status-row">
      <span class="music-audio-panel__status-dot" aria-hidden="true"></span>
      <h2 id="music-audio-heading">Sound not enabled</h2>
    </div>
    <p id="music-audio-message">Enable sound once during setup so Music Quiz tracks can start reliably.</p>
  </div>
  <div class="music-audio-panel__controls">
    <button id="music-audio-action" class="button-primary" type="button">🔔 Enable sound</button>
    <label class="music-audio-panel__volume" for="music-audio-volume">
      <span>Volume</span>
      <input id="music-audio-volume" type="range" min="0" max="1" step="0.05" value="0.85">
    </label>
  </div>
  <audio id="music-player" preload="auto" loop>
    Your browser does not support audio playback.
  </audio>
</section>
{% endif %}
