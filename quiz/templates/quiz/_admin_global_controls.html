<div id="admin-global-controls"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <input class="poll-context" type="hidden" name="global_context" value="{{ global_context }}">
  {% if run_id %}
    <div class="toolbar" aria-label="Global game controls">
      {% if global_state == 'ADVENT_QUIZ' or global_state == 'MUSIC_QUIZ' %}
        <form method="post" action="{% url 'admin_action' 'pause' %}"
              hx-post="{% url 'admin_action' 'pause' %}" hx-sync="#live-admin:replace"
              hx-disabled-elt="find button[type='submit']"
              hx-target="#admin-state" hx-swap="innerHTML">
          {% csrf_token %}<input type="hidden" name="run_id" value="{{ run_id }}">
          <input type="hidden" name="request_id" value="{{ pause_request_id }}">
          <button type="submit">Pause game</button>
        </form>
      {% elif global_state == 'PAUSED' %}
        <form method="post" action="{% url 'admin_action' 'resume' %}"
              hx-post="{% url 'admin_action' 'resume' %}" hx-sync="#live-admin:replace"
              hx-disabled-elt="find button[type='submit']"
              hx-target="#admin-state" hx-swap="innerHTML">
          {% csrf_token %}<input type="hidden" name="run_id" value="{{ run_id }}">
          <input type="hidden" name="request_id" value="{{ resume_request_id }}">
          <button class="button-primary" type="submit">Resume game</button>
        </form>
      {% endif %}
      <form method="post" action="{% url 'admin_action' 'reset' %}"
            hx-post="{% url 'admin_action' 'reset' %}" hx-sync="#live-admin:replace"
            hx-disabled-elt="find button[type='submit']"
            hx-target="#admin-state" hx-swap="innerHTML"
            onsubmit="return confirm('End this game and return to package selection? The run history will be preserved.');">
        {% csrf_token %}<input type="hidden" name="run_id" value="{{ run_id }}">
        <input type="hidden" name="request_id" value="{{ reset_request_id }}">
        <button class="button-danger" type="submit">Reset full game</button>
      </form>
    </div>
  {% endif %}
</div>
