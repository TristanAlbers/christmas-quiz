[agents]
enabled = true
# Safety/usage circuit breaker: one spawned specialist at a time.
# The primary thread is not counted in this value.
max_concurrent_threads_per_session = 1

# Fallback for unconfigured subagents. Routine routing, inspection, and verification
# should stay on Terra/Medium unless a named specialist explicitly requires more.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[agents.architect]
description = "Design/review-only lead for shared contracts, architecture decisions, ownership, UI/projection contracts, and cross-boundary ambiguity. Does not perform bulk production implementation."
config_file = "agents/architect.toml"

[agents.game_engine]
description = "Default domain implementer for bounded game-rule work and focused deterministic tests. Uses Sol at Medium reasoning."
config_file = "agents/game_engine.toml"

[agents.game_engine_high]
description = "Escalation-only high-reasoning domain specialist for genuinely subtle state-machine or rule-interaction problems after the default game_engine pass is insufficient."
config_file = "agents/game_engine_high.toml"

[agents.persistence_security]
description = "High-reasoning persistence/security specialist for schema, atomic transactions, authentication, authorization, isolation, concurrency, snapshots, and recovery."
config_file = "agents/persistence_security.toml"

[agents.integrator]
description = "Sol/Medium backend/web integrator for application orchestration, Django projections/routes, HTMX synchronization contracts, demo data, and documentation after specialist contracts are settled."
config_file = "agents/integrator.toml"

[agents.ui_experience]
description = "Sol/Medium first-class UI specialist for Views.md requirements, Christmas visual language, responsive presentation, and polling-safe interaction/browser behavior."
config_file = "agents/ui_experience.toml"

[agents.test_invariants]
description = "Independent Terra/Medium post-integration/UI reviewer for adversarial coverage gaps, concurrency/isolation/recovery risks, polling/browser regressions, and requirement traceability."
config_file = "agents/test_invariants.toml"
