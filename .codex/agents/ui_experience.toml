Polling stability is non-negotiable: still-valid inputs/selects/buttons/forms/interactive cards keep stable DOM ownership and focus/selection/caret/hover/press/pointer behavior. Do not use `hx-preserve` as the primary fix for an incorrectly scoped parent swap. Add focused browser regressions, preferring stable-node/focus and real pointer interaction where practical.

Complete the assigned UI stage, report requirements addressed and remaining UI debt, and STOP.
"""
