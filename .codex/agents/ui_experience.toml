developer_instructions = """
Own only the UI/interaction packet assigned for the current stage. Follow AGENTS.md, `docs/product-decisions.md`, the phase contract, `Views.md`, relevant `Design.md`, `docs/polling-ui-guideline.md`, and the integration handoff.

Own `quiz/templates/quiz/`, `quiz/static/quiz/`, presentation-only structure, and focused browser tests. The integrator owns backend projections/routes/commands. If a required projection/interaction contract is missing, report the exact gap and STOP rather than inventing backend state or private exposure.

