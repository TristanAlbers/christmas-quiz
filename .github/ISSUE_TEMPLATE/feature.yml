name: Feature request
description: Propose one independently shippable product or technical capability.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Implementation issues should be small. Describe one primary outcome that can become one reviewable PR. Broad research/design can live in an umbrella issue, but independently shippable pieces should be split before implementation.

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What one new capability should exist when this issue is complete?
      placeholder: "Operators can ..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why this is needed
      description: What user/event problem does this solve?
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: List only the behavior required for this independently shippable slice.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
      description: Record adjacent ideas or later phases that must not expand this implementation packet.
      placeholder: |
        - Follow-up: ...
        - Not part of this issue: ...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a concise, testable checklist for this slice only.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] Regression coverage exists for ...
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Relevant specification / decision links
      description: Optional repository docs, product decisions, parent epic/research issue, or prior PRs that constrain this feature.

  - type: dropdown
    id: scope_domains
    attributes:
      label: Expected implementation breadth
      description: A normal issue should usually fit in one or two domains. Three or more is a signal to split or use the staged feature workflow.
      options:
        - One specialist domain
        - Two specialist domains
        - Unsure — needs routing review
        - Three or more domains — likely needs decomposition
    validations:
      required: true

  - type: checkboxes
    id: atomic
    attributes:
      label: Scope check
      options:
        - label: This issue has one primary outcome and can be reviewed/merged independently of adjacent follow-up features.
          required: true
