name: Bug report
description: Report one reproducible defect with a small, independently fixable outcome.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Keep this issue focused on one defect. If fixing it would require several independently shippable behavior changes, split those into separate issues and link them.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is going wrong? Describe the observable defect, not the implementation you expect.
      placeholder: "When ..., the quiz ..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence that demonstrates the bug.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What single observable outcome should replace the faulty behavior?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional logs, screenshots, browser/device details, timing, or related PR/issue links.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Keep these narrowly tied to this defect and its regression coverage.
      placeholder: |
        - [ ] The defect no longer reproduces.
        - [ ] Nearby invariant/regression coverage is preserved.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
      description: Related improvements that should not be pulled into this fix.

  - type: checkboxes
    id: atomic
    attributes:
      label: Scope check
      options:
        - label: This issue describes one primary defect/fix that can be reviewed and merged independently.
          required: true
