name: Agent run watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      threshold_minutes:
        description: Minutes after actionable external evidence before marking stalled
        required: false
        default: "45"
      dry_run:
        description: Detect and report without changing PR comments
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-run-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Detect stalled autonomous PR runs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect durable run-health checkpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_THRESHOLD_MINUTES: ${{ inputs.threshold_minutes || '45' }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(
            --repo "$GITHUB_REPOSITORY"
            --token "$GITHUB_TOKEN"
            --threshold-minutes "$WATCHDOG_THRESHOLD_MINUTES"
          )
          if [ "$WATCHDOG_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/agent_run_watchdog.py "${args[@]}"
