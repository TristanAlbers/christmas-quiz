name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build development test image
        run: docker build --target dev --tag christmas-quiz-ci .

      - name: Lint Python
        run: docker run --rm christmas-quiz-ci python -m ruff check .

      - name: Django system check
        run: >-
          docker run --rm
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          christmas-quiz-ci
          python manage.py check

      - name: Check for missing migrations
        run: >-
          docker run --rm
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          christmas-quiz-ci
          python manage.py makemigrations --check --dry-run

      - name: Run complete test suite
        run: >-
          docker run --rm
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          -e TEST_DATABASE_PATH=/tmp/christmas-quiz-tests.sqlite3
          christmas-quiz-ci
          python manage.py test --verbosity 2
