name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: christmas-quiz-ci

jobs:
  fast-tests:
    name: Quality and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test agent run watchdog
        run: python3 .github/scripts/test_agent_run_watchdog.py

      - name: Build development test image
        run: docker build --target dev --tag $CI_IMAGE .

      - name: Lint Python
        run: docker run --rm $CI_IMAGE python -m ruff check .

      - name: Django system check
        run: >-
          docker run --rm
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          $CI_IMAGE
          python manage.py check

      - name: Check for missing migrations
        run: >-
          docker run --rm
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          $CI_IMAGE
          python manage.py makemigrations --check --dry-run

      - name: Run domain, integration, and security tests
        run: >-
          docker run --rm
          -e DJANGO_SETTINGS_MODULE=config.test_settings
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          -e TEST_DATABASE_PATH=/tmp/christmas-quiz-tests.sqlite3
          $CI_IMAGE
          python manage.py test
          tests.domain tests.integration tests.security
          --verbosity 2 --timing --durations 20

  browser-tests:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sync-feedback
            tests: >-
              tests.browser.test_live_sync
              tests.browser.test_issue18_incorrect_answer_feedback
              tests.browser.test_issue39_puzzle_audio
              tests.browser.test_issue41_dutch_first
              tests.browser.test_issue72_midnight_entry
              tests.browser.test_issue74_team_advent_panel
              tests.browser.ui74_capture_temp
              tests.browser.test_issue79_admin_ready
              tests.browser.test_issue42_team_ui
              tests.browser.test_issue42_review_regressions
              tests.browser.test_phase31_views
              tests.browser.test_phase3_views
          - shard: music-calendar
            tests: >-
              tests.browser.test_phase5_views
              tests.browser.test_issue9_music_audio
              tests.browser.test_issue44_music_gathering
              tests.browser.test_issue31_reverse
          - shard: effects-challenge
            tests: >-
              tests.browser.test_endgame_celebrations
              tests.browser.test_interaction_stability
              tests.browser.test_phase6_views
              tests.browser.test_phase4_views
              tests.browser.test_issue31_freeze
              tests.browser.test_issue43_public_overview
              tests.browser.test_issue73_midnight_tv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build development test image
        run: docker build --target dev --tag $CI_IMAGE .

      - name: Create screenshot directory
        run: install -d -m 0777 artifacts/ui-72 artifacts/ui-79 artifacts/ui-73 artifacts/ui-74 artifacts/ui-82

      - name: Run browser shard
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/artifacts/ui-72:/tmp/ui72"
          -v "${{ github.workspace }}/artifacts/ui-74:/tmp/ui74"
          -v "${{ github.workspace }}/artifacts/ui-79:/tmp/ui79"
          -v "${{ github.workspace }}/artifacts/ui-73:/tmp/ui73"
          -v "${{ github.workspace }}/artifacts/ui-82:/tmp/ui82"
          -e UI72_SCREENSHOT_DIR=/tmp/ui72
          -e UI74_SCREENSHOT_DIR=/tmp/ui74
          -e UI79_SCREENSHOT_DIR=/tmp/ui79
          -e UI73_SCREENSHOT_DIR=/tmp/ui73
          -e UI82_SCREENSHOT_DIR=/tmp/ui82
          -e DJANGO_SETTINGS_MODULE=config.test_settings
          -e DJANGO_SECRET_KEY=ci-only-not-used-in-production
          -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          -e DJANGO_DEBUG=false
          -e TEST_DATABASE_PATH=/tmp/christmas-quiz-browser.sqlite3
          $CI_IMAGE
          python manage.py test
          ${{ matrix.tests }}
          --verbosity 2 --timing --durations 20

      - name: Preserve issue 72 browser screenshots
        if: always() && matrix.shard == 'sync-feedback'
        uses: actions/upload-artifact@v4
        with:
          name: midnight-advent-issue-72
          path: artifacts/ui-72/*.png
          if-no-files-found: warn


      - name: Preserve issue 74 browser screenshots
        if: always() && matrix.shard == 'sync-feedback'
        uses: actions/upload-artifact@v4
        with:
          name: midnight-advent-issue-74
          path: artifacts/ui-74/*.png
          if-no-files-found: warn

      - name: Preserve issue 73 TV V4 screenshots
        if: always() && matrix.shard == 'effects-challenge'
        uses: actions/upload-artifact@v4
        with:
          name: midnight-advent-issue-73
          path: artifacts/ui-73/*.png
          if-no-files-found: warn

      - name: Preserve issue 82 Challenge screenshots
        if: always() && matrix.shard == 'effects-challenge'
        uses: actions/upload-artifact@v4
        with:
          name: midnight-advent-issue-82
          path: artifacts/ui-82/*.png
          if-no-files-found: warn

      - name: Preserve issue 79 Game Master screenshots
        if: always() && matrix.shard == 'sync-feedback'
        uses: actions/upload-artifact@v4
        with:
          name: midnight-advent-issue-79
          path: artifacts/ui-79/*.png
          if-no-files-found: warn

  quality-and-tests:
    name: Quality and tests
    if: always()
    needs:
      - fast-tests
      - browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required test jobs
        env:
          FAST_RESULT: ${{ needs.fast-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
